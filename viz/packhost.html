<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*__TITLE__*/</title>
<style>
 :root { --ink:#231e16; --paper:#f4f1ea; --muted:#5d5950; --line:#d6d1c4; --accent:#231e16; }
 * { box-sizing:border-box; }
 body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--paper); }
 button,select { font:inherit; padding:3px 8px; border:1px solid #9d978a; border-radius:6px; background:#fff; color:var(--ink); }
 button.on { background:var(--ink); color:#fff; }
 button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid #2a5fb0; outline-offset:1px; }
 html { -webkit-text-size-adjust:100%; }
 .pk { display:grid; grid-template-columns:clamp(230px,22vw,320px) minmax(0,1fr) clamp(230px,25vw,380px); grid-template-rows:auto minmax(0,1fr) auto; height:100vh; height:100dvh; max-width:100vw; }
 .pk > * { min-width:0; }
 .pk > header { grid-column:1/-1; padding:10px 18px 8px; border-bottom:1px solid var(--line); }
 h1 { font-size:19px; margin:0 0 2px; }
 .note { color:#8a2a2a; font-size:12.5px; max-width:1100px; }
 .err { color:#a2191f; font-size:13px; }
 aside { overflow:auto; overflow-x:hidden; padding:10px 14px; background:#f7f5ef; }
 .pk-legrow select { max-width:100%; min-width:0; } .pk-legrow label { flex-basis:100%; }
 #left { border-right:1px solid var(--line); } #right { border-left:1px solid var(--line); }
 #stagebox { position:relative; overflow:hidden; background:#f2efe7; cursor:grab; touch-action:none; min-height:240px; }
 #stagebox.dragging { cursor:grabbing; }
 #stagebox canvas { position:absolute; left:0; top:0; display:block; width:100%; height:100%; will-change:transform, opacity; pointer-events:none; }
 #stagebox #hilite { z-index:3; }                       /* above both stage canvases (refocus.js gives them z-index 1 and 2); without it the outlines drawn here sit under the map */
 #fit { position:absolute; right:10px; top:10px; z-index:4; }
 #reticle { position:absolute; left:50%; top:50%; width:96px; height:96px; margin:-48px 0 0 -48px; pointer-events:none; opacity:0; transition:opacity .35s ease; z-index:3; }
 #reticle i { position:absolute; width:22px; height:22px; border:2px solid rgba(35,30,22,.85); }
 #reticle i:nth-child(1) { left:0; top:0; border-right:0; border-bottom:0; } #reticle i:nth-child(2) { right:0; top:0; border-left:0; border-bottom:0; }
 #reticle i:nth-child(3) { left:0; bottom:0; border-right:0; border-top:0; } #reticle i:nth-child(4) { right:0; bottom:0; border-left:0; border-top:0; }
 #reticle.seek { opacity:1; animation:rseek .9s ease-in-out infinite; }
 #reticle.lock { opacity:1; transform:scale(.82); transition:transform .18s cubic-bezier(.2,1.5,.4,1), opacity .35s ease; }
 #reticle.lock i { border-color:#2ea36b; box-shadow:0 0 7px rgba(46,163,107,.65); }
 @keyframes rseek { 0%,100% { transform:scale(1.55); } 50% { transform:scale(1.18); } }
 @media (prefers-reduced-motion: reduce) { #reticle.seek { animation:none; transform:scale(1.3); } #reticle, #reticle.lock { transition:none; } }
 #bottom { grid-column:1/-1; border-top:1px solid var(--line); background:#f7f5ef; padding:8px 18px; max-height:42vh; overflow:auto; }
 fieldset { border:1px solid var(--line); border-radius:8px; margin:0 0 10px; padding:6px 10px 8px; background:#fff; }
 legend { font-weight:600; padding:0 4px; }
 details.pk-group { border:1px solid var(--line); border-radius:8px; margin:0 0 10px; background:#fff; }
 details.pk-group > summary { cursor:pointer; font-weight:600; padding:7px 10px; list-style:none; display:flex; justify-content:space-between; align-items:center; border-radius:8px; }
 details.pk-group > summary::-webkit-details-marker { display:none; }
 details.pk-group > summary::after { content:"+"; font-weight:400; font-size:18px; line-height:1; color:var(--muted); } details.pk-group[open] > summary::after { content:"\2212"; }
 details.pk-group > summary:focus-visible { outline:2px solid #2a5fb0; outline-offset:1px; }
 details.pk-group > .pk-gbody { padding:0 10px 6px; }
 .pk-row { display:grid; grid-template-columns:1fr auto; gap:1px 8px; align-items:center; margin:6px 0; }
 .pk-row label { grid-column:1/-1; font-size:13px; }
 .pk-row input[type=range] { width:100%; margin:0; } .pk-row select { grid-column:1/-1; }
 .pk-row.pk-bool { grid-template-columns:auto 1fr; } .pk-row.pk-bool label { grid-column:2; grid-row:1; } .pk-row.pk-bool input { grid-column:1; grid-row:1; }
 .pk-row small { grid-column:1/-1; color:var(--muted); font-size:12px; line-height:1.3; }
 .pk-val { font-variant-numeric:tabular-nums; min-width:3.2em; text-align:right; }
 .pk-btns { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; }
 .pk-legrow { display:flex; flex-wrap:wrap; gap:3px 12px; align-items:center; margin:6px 0 10px; font-size:13px; } .pk-legrow > b { flex-basis:100%; }
 .pk-sw { display:inline-flex; gap:5px; align-items:center; } .pk-sw i,.pk-ramp i { display:inline-block; width:16px; height:16px; border:1px solid var(--ink); border-radius:3px; }
 .pk-ramp { display:inline-flex; gap:5px; align-items:center; } .pk-ramp i { width:clamp(64px,9vw,110px); }
 .pk-check { display:flex; gap:6px; align-items:center; margin:3px 0; font-size:13px; }
 .pk-timeline { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
 .pk-timeline input[type=range] { flex:1 1 220px; min-width:140px; } .pk-time { min-width:8.5em; font-variant-numeric:tabular-nums; }
 .pk-readout { flex-basis:100%; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
 .pk-readout summary { cursor:pointer; padding:2px 0; } .pk-readout ul { list-style:none; margin:2px 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:2px 16px; }
 .pk-readout li b { font-weight:600; color:var(--ink); }
 #tip { position:absolute; z-index:5; pointer-events:none; background:#231e16; color:#fff; font-size:12.5px; padding:3px 8px; border-radius:5px; white-space:nowrap; max-width:60%; overflow:hidden; text-overflow:ellipsis; }
 #tip[hidden], .pk-inspector[hidden] { display:none; }
 .pk-inspector { background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 10px 8px; margin:0 0 10px; }
 /* docked: lies over the map's top-right corner, always in view, shown on a selection and hidden when it is cleared */
 .pk-inspector.pk-docked { position:absolute; z-index:6; right:10px; top:48px; width:min(300px,calc(100% - 20px)); max-height:calc(100% - 60px); overflow:auto; margin:0; cursor:default; touch-action:pan-y; box-shadow:0 4px 16px rgba(35,30,22,.22); border-color:#1d4ed8; }
 .pk-inspector header { display:flex; justify-content:space-between; align-items:center; gap:8px; } .pk-inspector header button { padding:0 7px; line-height:1.3; }
 .pk-fields { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:6px 0 0; font-size:13px; } .pk-fields dt { color:var(--muted); } .pk-fields dd { margin:0; font-variant-numeric:tabular-nums; }
 .pk-extra { border-top:1px solid var(--line); padding-top:6px; } .pk-extra:empty { display:none; } .pk-note { margin:6px 0 0; color:var(--muted); font-size:12px; } .pk-note:empty { display:none; }

 /* dashboard (P5): charts, KPI tiles, A/B compare, presets */
 .pk-item { margin:0 0 12px; min-width:0; } .pk-item-title { display:block; margin:0 0 4px; }
 .pk-chart { background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 10px 8px; }
 .pc { margin:0; font-family:var(--pc-font,inherit); color:var(--pc-ink,var(--ink)); } .pc-title { font-weight:600; font-size:13px; margin:0 0 2px; }
 .pc-readout { min-height:1.35em; font-size:12.5px; color:var(--pc-muted,var(--muted)); font-variant-numeric:tabular-nums; } .pc-svg { max-height:300px; touch-action:none; }
 .pc-legend { list-style:none; display:flex; flex-wrap:wrap; gap:2px 10px; margin:2px 0 0; padding:0; } .pc-legend[hidden] { display:none; }
 .pc-key { display:inline-flex; gap:5px; align-items:center; border:0; background:none; padding:2px 3px; font-size:12.5px; color:inherit; cursor:pointer; border-radius:4px; } .pc-key:disabled { cursor:default; } .pc-key.off { opacity:.45; text-decoration:line-through; }
 .pc[data-register=formal] .pc-title { font-weight:400; letter-spacing:.01em; }
 .pc-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; } .pc-kpis[hidden] { display:none; }
 .pc-kpi { background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; } .pc-kpi-label { font-size:12.5px; color:var(--muted); }
 .pc-kpi-value { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.2; } .pc-kpi-unit { font-size:12.5px; font-weight:400; color:var(--muted); }
 .pc-kpi-cmp { font-size:12.5px; color:var(--ink); border-top:1px dashed var(--line); margin-top:4px; padding-top:3px; font-variant-numeric:tabular-nums; }
 .pk-compare { background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; } .pk-cmprow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
 .pk-cmprow select { flex:1 1 130px; min-width:0; } .pk-diff { margin:4px 0 0; padding-left:18px; font-size:12.5px; color:var(--muted); } .pk-diff:empty { display:none; }
 .pk-presets { margin:0 0 10px; } .pk-btns button[aria-pressed=true] { box-shadow:inset 0 0 0 1px #fff; } .pk-reset { margin-left:auto; border-style:dashed; }
 #bottom { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:8px 14px; align-items:start; } #bottom > .pk-timeline, #bottom > .pk-kpis { grid-column:1/-1; } #bottom > .pk-item { margin:0; }
 #mapbadge { position:absolute; left:10px; top:10px; z-index:4; background:#231e16; color:#fff; font-size:12.5px; padding:3px 9px; border-radius:5px; pointer-events:none; } #mapbadge[hidden] { display:none; }
 :root[data-register=formal] body, body[data-register=formal] { --ink:#161616; --paper:#f4f4f4; --muted:#525252; --line:#e0e0e0; }
 /* touch: comfortable targets on phones and tablets */
 @media (pointer:coarse), (max-width: 860px) {
  button, select { min-height:44px; padding:6px 12px; } .pk-btns { gap:8px; } .pk-check { min-height:44px; } .pk-check input, .pk-row.pk-bool input { width:22px; height:22px; }
  input[type=range] { min-height:32px; } details.pk-group > summary { min-height:44px; } .pc-key { min-height:36px; } .pk-inspector header button { min-width:44px; min-height:44px; }
  #fit { min-width:56px; }
 }
 /* one column (phones, small tablets): map first at a fixed height, then the timeline, then the controls in collapsible sections, then legend and charts */
 @media (max-width: 860px) {
  .pk { display:flex; flex-direction:column; height:auto; min-height:100vh; }
  .pk > header { order:0; padding:8px 12px 6px; } h1 { font-size:17px; } .note { font-size:12px; line-height:1.35; }
  #stagebox { order:1; flex:0 0 auto; height:clamp(280px,50vh,520px); min-height:0; border-bottom:1px solid var(--line); }
  #bottom { order:2; max-height:none; padding:8px 12px; border-top:0; } #left { order:3; } #right { order:4; }
  aside { overflow:visible; padding:10px 12px; } #left,#right { border:0; }
  .pk-timeline { gap:6px 10px; } .pk-timeline > input[type=range] { order:5; flex:1 1 100%; } .pk-time { flex:1 1 auto; min-width:0; } .pk-timeline > label { margin-left:auto; }
  .pc-svg { max-height:260px; }
  .pk-inspector.pk-docked { left:8px; right:8px; top:auto; bottom:8px; width:auto; max-height:46%; }
 }
 @media (min-width: 560px) and (max-width: 860px) { .pk-inspector.pk-docked { left:auto; right:10px; top:56px; bottom:auto; width:300px; max-height:calc(100% - 66px); } }
 @media (max-width: 420px) { .pc-kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } .pc-kpi-value { font-size:19px; } }
</style></head><body>
<div class="pk">
  <header>

  <aside id="right" aria-label="Legend, charts and display"></aside>
  <div id="bottom"></div>
</div>

<!-- the same sources again as text, for the worker (a Blob made from them); never executed here -->
<script type="text/plain" id="pk-src-runtime">/*__PACKRUNTIME__*/</script>
<script type="text/plain" id="pk-src-worker">/*__PACKWORKER__*/</script>
<script type="text/plain" id="pk-src-entry">/*__PACKRUNTIMESRC__*/</script>
<script>
(function () {
  const V = window.VizLib, A = window.AssetLib, $ = id => document.getElementById(id);
  A.sprites.factory = A.canvasFactory(document);          // memory-backed offscreen canvases: see canvasFactory (paperdolls#3)
  A.sprites.dpr = window.devicePixelRatio || 1;
  const FAMS = /*__PALETTES__*/;
  const MANIFEST = /*__PACK__*/;
  const EMBEDDED_SCENE = /*__SCENE__*/;                 // a scene object, or null for the synthetic placeholder
  const problem = msg => { $('problem').textContent = msg; };

  // ---- the pack: validate it, find its runtime, start the store ----
  const check = PackSpec.validate(MANIFEST);
  if (!check.ok) { problem('This pack does not validate: ' + check.errors.slice(0, 3).join('; ') + (check.errors.length > 3 ? ' (and ' + (check.errors.length - 3) + ' more)' : '')); return; }
  const impl = PaperDolls.getRuntime(MANIFEST.id);
  if (!impl) { problem('The pack’s runtime did not register itself as ' + MANIFEST.id + '.'); return; }
  // the pack binds to the scene first (its own entities from real buildings, or none: then the invented order), on this thread, where its runtime file is loaded
  const scene = EMBEDDED_SCENE || V.makePlaceholderScene(7);
  const bound = PackRuntime.bindScene(MANIFEST, impl, scene);
  if (!bound.ok) { problem('This pack could not bind to the scene: ' + bound.error); return; }
  // the runtime runs in a Web Worker made from the page's own text; where there is none (or it will not start) the same code runs on this thread. #worker=0 forces this thread.
  const store = PackStore.create(MANIFEST), text = id => document.getElementById(id).textContent;
  const makeRuntime = () => PackWorker.create(MANIFEST, { counts: bound.counts, attrs: bound.attrs, mode: /worker=0/.test(location.hash) ? 'inline' : 'auto', sources: { runtime: text('pk-src-runtime'), worker: text('pk-src-worker'), entry: text('pk-src-entry') } });
  const runtime = makeRuntime();
  const ctl = PackHost.createController({ manifest: MANIFEST, runtime, store, schedule: () => setTimeout(() => ctl.flush(), 0) });
  // the A/B compare (P5): B is a second store and a second runtime handle, made when the comparison is first switched on; `view` reads A or B (the run the map shows)
  const compare = PackDash.createCompare({ manifest: MANIFEST, store, createRuntime: makeRuntime, schedule: () => setTimeout(() => compare.flush(), 0) });
  const view = compare.viewStore, origInspect = ctl.inspect;
  ctl.inspect = sel => compare.inspect(sel, origInspect);
  const register = /register=formal/.test(location.hash) ? 'formal' : 'colorfigures';
  document.body.setAttribute('data-register', register);

  // ---- the renderer: the existing one, on the synthetic placeholder unless a scene is embedded ----
  const fam = FAMS.families.find(f => f.id === 'nw'), look = (fam.looks.find(k => k.id === 'brick') || fam.looks[0]).id;
  const theme = A.theme(fam, look, 'colorfigures');
  const sim = V.createSim(scene, { seed: 11, theme, region: 'nw' });
  sim.opts.layerMs = 12;                                // a patch repaints the far-zoom layer in slices: twice the renderer's 6 ms a frame finishes it in about a third of the frames (viz/README.md)
  const canvas = $('stage'), canvas2 = $('stage2'), ctx = canvas.getContext('2d'), ctx2 = canvas2.getContext('2d'), ctxOf = new Map([[canvas, ctx], [canvas2, ctx2]]);
  const hilite = $('hilite'), hctx = hilite.getContext('2d');
  const cam = LabCamera.create({ bounds: V.sceneBounds(scene), zmax: V.sceneRelief(scene), width: canvas.clientWidth || 1200, height: canvas.clientHeight || 700 });
  const box = $('stagebox'), hold = ZoomHold.create(canvas, { settleMs: 120 });
  const calm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const controls = LabControls.attach(box, cam, { smoothZoom: !calm });
  const rf = Refocus.create({ hold, front: canvas, back: canvas2, reticle: $('reticle'), fadeMs: calm ? 0 : 160, blur: false,
                              isDone: () => A.sprites.builds === 0 && !sim._groundP && !sim._farP });
  box.addEventListener('wheel', e => { const r = box.getBoundingClientRect(); rf.anchor(e.clientX - r.left, e.clientY - r.top); }, { passive: true, capture: true });
  $('fit').onclick = () => cam.fitAll();
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    for (const [c, x] of [...ctxOf, [hilite, hctx]]) { c.width = canvas.clientWidth * dpr; c.height = canvas.clientHeight * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); }
    rf.reset(); rf.anchor(canvas.clientWidth / 2, canvas.clientHeight / 2); cam.resize(canvas.clientWidth || 1200, canvas.clientHeight || 700);
  }
  const binding = PackHost.bindRenderer({ manifest: MANIFEST, store: view, controller: ctl, sim, bound });
  if (!binding.ok) problem('Cannot draw the model on this scene: ' + binding.error);

  // ---- the page: banner, controls, legend, timeline ----
  const note = !binding.ok ? '' : binding.bound
    ? ' Each model building stands on the scene building it was made from (' + binding.placed + ' of ' + binding.count + ' placed' + (binding.warnings.length ? '; ' + binding.warnings.join('; ') : '') + '). People, vehicles and trees are decoration.'
    : ' Placement invented: each model building is drawn on a scene building in a fixed order, so where it stands carries no meaning. People, vehicles and trees are decoration.';
  $('banner').textContent = (MANIFEST.banner || '') + note;
  const layers = { buildings: true, vehicles: true, people: true };
  let ink = false, pixel = false, fog = false;
  const apply = () => { sim.opts.ink = ink; sim.opts.pixel = pixel ? 1.5 : 0; sim.opts.posterize = pixel ? 12 : 0; sim.opts.fog = fog; };
  const display = [
    { id: 'people', label: 'people', checked: true, onchange: v => { layers.people = v; } },
    { id: 'vehicles', label: 'vehicles', checked: true, onchange: v => { layers.vehicles = v; } },
    { id: 'ink', label: 'ink outline', checked: false, onchange: v => { ink = v; apply(); } },
    { id: 'pixel', label: 'pixel', checked: false, onchange: v => { pixel = v; apply(); } },
    { id: 'fog', label: 'fog', checked: false, onchange: v => { fog = v; apply(); } },
  ];
  const pick = binding.ok ? Pick.create(sim) : null;
  const inter = binding.ok ? PackHost.bindInteraction({ manifest: MANIFEST, store: view, sim, binding, pick, box, camera: cam, doc: document, tip: $('tip'), controller: ctl }) : null;
  const ui = PackHost.mountUI({ manifest: MANIFEST, store: view, controller: ctl, compare, register, doc: document, regions: { left: $('left'), right: $('right'), bottom: $('bottom'), inspector: $('stagebox') }, display });
  const badge = $('mapbadge'), drawBadge = () => { badge.hidden = !(compare.enabled && compare.showing === 'b'); badge.textContent = badge.hidden ? '' : 'Map shows B: ' + compare.labelOf(compare.bSource); };
  compare.onChange(w => { if (w === 'showing' || w === 'enabled' || w === 'b') { drawBadge(); } }); drawBadge();
  compare.onChange(w => { if (w === 'error') problem(compare.error); });
  ctl.onRun = c => { if (c.error) problem('The model failed: ' + c.error); else if ($('problem').textContent.startsWith('The model failed')) problem(''); };
  ctl.start().then(() => { if (ctl.error) problem('The model failed: ' + ctl.error); });
  ui.refresh();
  window.labPack = { manifest: MANIFEST, store, view, compare, register, controller: ctl, runtime, sim, binding, ui, pick, interaction: inter, tip: $('tip') };       // a handle for tests and for the browser console
  window.labViewer = { camera: cam, controls, refocus: rf, sim };

  let last = performance.now(), lastFailure = '';
  function frame(now) {
    try {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      V.stepSim(sim, dt);
      ctl.flush();                                        // a moved slider re-runs the model once per frame, however many input events came
      compare.flush();
      ctl.advance(dt);
      const view = cam.view();
      rf.frame(view, now, c => V.renderFrame(ctxOf.get(c), sim, view, layers));
      if (inter) inter.drawHighlight(hctx, view);
    } catch (e) {
      const msg = String((e && e.message) || e);
      if (msg !== lastFailure) { lastFailure = msg; console.error(e); problem('A frame failed and was skipped: ' + msg); }
      try { rf.reset(); } catch (_) { /* nothing more to do */ }
    } finally { requestAnimationFrame(frame); }
  }
  window.addEventListener('resize', resize);
  resize(); cam.fitAll();
  requestAnimationFrame(frame);
})();
</script>
</body></html>
