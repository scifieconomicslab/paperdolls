[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperdolls"
version = "0.7.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pillow>=10.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
paperdolls = "paperdolls.cli:main"

[tool.setuptools.packages.find]
include = ["paperdolls*"]

[tool.setuptools.package-data]
paperdolls = ["*.js"]
